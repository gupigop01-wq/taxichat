services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Full application: API + sockets + Agenda + prebuilt client
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/taxichat
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      CLIENT_URL: ${CLIENT_URL:-}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@bombila.app}
    depends_on:
      - mongo
    restart: unless-stopped

  # TURN server for voice calls: traffic is relayed so participant IP
  # addresses are not exposed to each other (concept 1.7.1)
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-dev-turn-secret}
    command: >
      -n
      --realm=taxichat
      --fingerprint
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET:-dev-turn-secret}
      --no-multicast-peers
      --no-cli
      --listening-port=3478

volumes:
  mongo-data:
